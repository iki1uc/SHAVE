<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>SHAVE Station — Verteiler</title>

    <!-- Selbe JS-Dateien, selbe Höhe -->
    <script type="module" src="shell.js"></script>
    <script type="module" src="gicik.js"></script>
    <script type="module" src="zwick.js"></script>
    <script type="module" src="nerdCharm.js"></script>
    <script type="module" src="nohero.js"></script>
    <script type="module" src="NC.math"></script>

    <style>
        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: monospace;
            padding: 40px;
        }
        .title {
            font-size: 32px;
            margin-bottom: 20px;
        }
        .log {
            margin-top: 30px;
            padding: 20px;
            background: #1a1a1a;
            border-left: 4px solid #4af;
        }
    </style>
</head>

<body>

<div class="title">SHAVE Station — Verteiler aktiv</div>

<div class="log" id="log">Starte Mystery‑Verteilung…</div>

<script type="module">
    import { Shell } from "./shell.js";
    import { gicik } from "./gicik.js";
    import { zwick } from "./zwick.js";
    import { charm } from "./nerdCharm.js";
    import { nohero } from "./nohero.js";
    import { calcDistribution } from "./NC.math";

    const log = document.getElementById("log");

    function out(x) {
        log.innerHTML += "<br>" + JSON.stringify(x);
    }

    // HÜA HOT START — Verteiler-Impuls
    const essoOut = Shell.distribute("ESSO");
    out(essoOut);

    const rollerOut = zwick("ROLLER");
    out(rollerOut);

    const kasseOut = charm("KASSE");
    out(kasseOut);

    const doorOut = gicik("DOOR");
    out(doorOut);

    const dooOut = nohero("DOO");
    out(dooOut);

    const shellOut = Shell.distribute("SHELL");
    out(shellOut);

    // Mystery-Berechnung
    const mysteryCalc = calcDistribution("SHAVE-MYSTERY");
    out(mysteryCalc);

</script>

</body>
</html>
